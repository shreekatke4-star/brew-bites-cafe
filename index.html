<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Brew & Bites — Order Menu</title>
  <meta name="description" content="Order fresh brews and bites right from your table at Brew & Bites cafe." />
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ── App Shell ── */
    body { background: var(--cream-bg); min-height: 100vh; }

    #app {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
      background: var(--cream-bg);
    }

    /* ── Screen transitions ── */
    .screen {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      overflow-x: hidden;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .screen.active {
      opacity: 1;
      pointer-events: all;
      position: relative;
    }

    /* ════════════════════════════════
       SCREEN 1 — MENU
    ════════════════════════════════ */
    #screen-menu { background: var(--cream-bg); padding-bottom: 90px; }

    /* Header */
    .menu-header {
      background: var(--brown-deep);
      padding: 16px 20px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .menu-header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .cafe-logo-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .cafe-logo-icon {
      width: 38px; height: 38px;
      background: var(--accent);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .cafe-name {
      color: var(--white);
      font-size: 18px;
      font-weight: 700;
    }
    .cart-icon-btn {
      position: relative;
      background: rgba(255,255,255,0.12);
      border: none;
      border-radius: 10px;
      width: 40px; height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--white);
      font-size: 20px;
      transition: background 0.2s;
    }
    .cart-icon-btn:hover { background: rgba(255,255,255,0.2); }
    .cart-badge {
      position: absolute;
      top: -5px; right: -5px;
      background: var(--accent);
      color: var(--white);
      font-size: 11px;
      font-weight: 700;
      min-width: 18px; height: 18px;
      border-radius: 99px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
    }
    .table-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.15);
      color: var(--cream-light);
      padding: 5px 12px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 500;
    }

    /* Banner Carousel */
    .banner-carousel {
      margin: 16px 16px 0;
      border-radius: var(--radius-lg);
      overflow: hidden;
      position: relative;
      height: 160px;
    }
    .banner-track {
      display: flex;
      height: 100%;
      transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: transform;
    }
    .banner-slide {
      flex: 0 0 100%;
      position: relative;
      height: 100%;
    }
    .banner-slide img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .hero-overlay {
      position: absolute;
      inset: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .hero-tag {
      display: inline-block;
      background: var(--accent);
      color: var(--white);
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 6px;
      width: fit-content;
    }
    .hero-title {
      color: var(--white);
      font-size: 22px;
      font-weight: 800;
      line-height: 1.2;
    }
    .hero-sub {
      color: rgba(255,255,255,0.8);
      font-size: 13px;
      margin-top: 4px;
    }
    /* Carousel dots */
    .banner-dots {
      position: absolute;
      bottom: 10px;
      right: 14px;
      display: flex;
      gap: 5px;
      z-index: 10;
    }
    .banner-dot {
      height: 6px;
      width: 6px;
      border-radius: 3px;
      background: rgba(255,255,255,0.45);
      transition: all 0.35s ease;
      cursor: pointer;
      border: none;
      padding: 0;
    }
    .banner-dot.active {
      width: 20px;
      background: var(--white);
    }

    /* Offer Banner */
    .offer-banner {
      margin: 14px 16px 0;
      background: var(--brown-deep);
      border-radius: var(--radius-md);
      padding: 13px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .offer-tag {
      background: var(--accent);
      color: var(--white);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }
    .offer-text {
      color: var(--cream-light);
      font-size: 13px;
      font-weight: 500;
    }

    /* Categories */
    .section-title {
      padding: 18px 16px 10px;
      font-size: 18px;
      font-weight: 700;
      color: var(--text-dark);
    }
    .categories-scroll {
      display: flex;
      gap: 8px;
      padding: 0 16px 16px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .categories-scroll::-webkit-scrollbar { display: none; }

    /* Featured Row (horizontal scroll) */
    .featured-scroll {
      display: flex;
      gap: 12px;
      padding: 0 16px 16px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .featured-scroll::-webkit-scrollbar { display: none; }
    .featured-card {
      flex: 0 0 130px;
      background: var(--white);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .featured-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
    .featured-card img {
      width: 100%; height: 90px;
      object-fit: cover;
    }
    .featured-card-body { padding: 10px; }
    .featured-card-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 4px;
    }
    .featured-card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .featured-card-price {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
    }
    .add-btn-sm {
      width: 26px; height: 26px;
      background: var(--accent);
      color: var(--white);
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .add-btn-sm:hover { background: var(--brown-mid); transform: scale(1.1); }

    /* Small qty control for featured cards */
    .qty-control-sm {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .qty-btn-sm {
      width: 24px; height: 24px;
      border: 2px solid var(--accent);
      background: transparent;
      color: var(--accent);
      border-radius: 6px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      line-height: 1;
      padding: 0;
      font-family: 'Outfit', sans-serif;
    }
    .qty-btn-sm:hover { background: var(--accent); color: var(--white); }
    .qty-num-sm {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-dark);
      min-width: 16px;
      text-align: center;
    }

    /* Menu List Items */
    .menu-list { padding: 0 16px; }
    .menu-item {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--white);
      border-radius: var(--radius-md);
      padding: 14px;
      margin-bottom: 10px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s, box-shadow 0.2s;
      animation: fadeIn 0.35s ease forwards;
    }
    .menu-item:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .menu-item-img {
      width: 72px; height: 72px;
      border-radius: var(--radius-sm);
      object-fit: cover;
      flex-shrink: 0;
    }
    .menu-item-info { flex: 1; min-width: 0; }
    .menu-item-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 4px;
    }
    .menu-item-desc {
      font-size: 12px;
      color: var(--text-light);
      line-height: 1.4;
      margin-bottom: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .menu-item-price {
      font-size: 15px;
      font-weight: 700;
      color: var(--accent);
    }
    .add-btn {
      width: 34px; height: 34px;
      background: var(--accent);
      color: var(--white);
      border: none;
      border-radius: 10px;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .add-btn:hover { background: var(--brown-mid); transform: scale(1.1); }
    .qty-control {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .qty-btn {
      width: 30px; height: 30px;
      border: 2px solid var(--accent);
      background: transparent;
      color: var(--accent);
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .qty-btn:hover { background: var(--accent); color: var(--white); }
    .qty-num {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-dark);
      min-width: 20px;
      text-align: center;
    }

    /* Sticky Cart Bar */
    .cart-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 430px;
      background: var(--brown-deep);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 200;
      transition: transform 0.3s ease;
    }
    .cart-bar.hide { transform: translateX(-50%) translateY(100%); }
    .cart-bar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--white);
    }
    .cart-bar-icon { font-size: 22px; }
    .cart-bar-count {
      font-size: 14px;
      font-weight: 600;
      color: var(--cream-light);
    }
    .view-order-btn {
      background: var(--accent);
      color: var(--white);
      border: none;
      padding: 10px 22px;
      border-radius: var(--radius-md);
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .view-order-btn:hover { background: var(--accent-light); }

    /* ════════════════════════════════
       SCREEN 2 — CHECKOUT
    ════════════════════════════════ */
    #screen-checkout {
      background: var(--cream-bg);
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }
    .checkout-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      padding-bottom: 8px;
    }


    .checkout-header {
      background: var(--brown-deep);
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .back-btn {
      width: 36px; height: 36px;
      background: rgba(255,255,255,0.15);
      border: none;
      border-radius: 10px;
      color: var(--white);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .back-btn:hover { background: rgba(255,255,255,0.25); }
    .checkout-title {
      color: var(--white);
      font-size: 20px;
      font-weight: 700;
    }

    .checkout-body { padding: 20px; }

    .checkout-form-group {
      margin-bottom: 14px;
    }
    .form-icon-wrap {
      position: relative;
    }
    .form-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      color: var(--brown-light);
    }
    .form-icon-wrap .input-field {
      padding-left: 44px;
    }
    .textarea-wrap .form-icon {
      top: 16px;
      transform: none;
    }
    .textarea-field {
      width: 100%;
      padding: 14px 16px 14px 44px;
      border: 2px solid var(--cream-mid);
      border-radius: var(--radius-md);
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      color: var(--text-dark);
      background: var(--white);
      resize: none;
      height: 90px;
      outline: none;
      transition: border-color 0.2s;
    }
    .textarea-field:focus { border-color: var(--brown-light); }
    .textarea-field::placeholder { color: var(--brown-light); }

    .order-summary-box {
      background: var(--brown-deep);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin-top: 20px;
    }
    .order-summary-title {
      color: var(--white);
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.15);
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .summary-item-name {
      color: var(--cream-mid);
      font-size: 14px;
    }
    .summary-item-price {
      color: var(--cream-light);
      font-size: 14px;
      font-weight: 600;
    }
    .summary-divider {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.15);
      margin: 10px 0;
    }
    .summary-total-label {
      color: var(--white);
      font-size: 15px;
      font-weight: 700;
    }
    .summary-total-price {
      color: var(--accent-light);
      font-size: 17px;
      font-weight: 800;
    }

    .place-order-btn {
      width: 100%;
      margin: 0;
      background: var(--brown-deep);
      color: var(--white);
      border: none;
      padding: 18px 20px;
      font-family: 'Outfit', sans-serif;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      position: sticky;
      bottom: 0;
      z-index: 20;
      box-shadow: 0 -4px 24px rgba(46,21,3,0.18);
      border-radius: 0;
      overflow: hidden;
    }
    .place-order-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--brown-rich), var(--brown-deep));
    }
    .place-order-btn span { position: relative; z-index: 1; }
    .place-order-btn:hover { opacity: 0.9; }
    .place-order-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    /* ════════════════════════════════
       SCREEN 3 — ORDER CONFIRMED
    ════════════════════════════════ */
    #screen-confirmed {
      background: linear-gradient(160deg, var(--brown-deep) 0%, #1a0800 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
    }

    .confirmed-icon-wrap {
      width: 90px; height: 90px;
      background: var(--accent);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      margin-bottom: 24px;
      box-shadow: 0 0 0 16px rgba(200,120,42,0.2);
      animation: scaleIn 0.5s ease forwards, pulse 2s ease 0.5s infinite;
    }
    .confirmed-title {
      color: var(--white);
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .confirmed-sub {
      color: var(--cream-mid);
      font-size: 15px;
      margin-bottom: 32px;
    }
    .confirmed-card {
      width: 100%;
      max-width: 340px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin-bottom: 28px;
    }
    .confirmed-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .confirmed-label {
      color: var(--cream-mid);
      font-size: 14px;
    }
    .confirmed-value {
      color: var(--white);
      font-size: 14px;
      font-weight: 600;
    }
    .confirmed-value.accent { color: var(--accent-light); }
    .confirmed-divider {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.15);
      margin: 12px 0;
    }
    .confirmed-total-label {
      color: var(--cream-light);
      font-size: 15px;
      font-weight: 600;
    }
    .confirmed-total-value {
      color: var(--accent-light);
      font-size: 17px;
      font-weight: 800;
    }
    .order-more-btn {
      background: var(--white);
      color: var(--brown-deep);
      border: none;
      padding: 16px 48px;
      border-radius: var(--radius-md);
      font-family: 'Outfit', sans-serif;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .order-more-btn:hover { background: var(--cream-light); transform: translateY(-2px); }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-light);
    }
    .empty-state-icon { font-size: 48px; margin-bottom: 16px; }
    .empty-state-text { font-size: 16px; font-weight: 500; }

    /* ════════════════════════════════
       LOADING / SPLASH SCREEN
    ════════════════════════════════ */
    #splash-screen {
      position: fixed;
      inset: 0;
      background: linear-gradient(160deg, var(--brown-deep) 0%, #0f0500 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    #splash-screen.fade-out {
      opacity: 0;
      transform: scale(1.04);
      pointer-events: none;
    }
    .splash-logo-ring {
      width: 100px; height: 100px;
      border-radius: 50%;
      background: rgba(200,120,42,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      position: relative;
    }
    .splash-logo-ring::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: var(--accent);
      border-right-color: var(--accent-light);
      animation: spin 1s linear infinite;
    }
    .splash-logo-inner {
      width: 80px; height: 80px;
      background: var(--accent);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      animation: pulse 1.5s ease infinite;
    }
    .splash-cafe-name {
      color: var(--white);
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .splash-tagline {
      color: var(--cream-mid);
      font-size: 14px;
      font-weight: 400;
      margin-bottom: 40px;
    }
    .splash-dots {
      display: flex;
      gap: 8px;
    }
    .splash-dot {
      width: 8px; height: 8px;
      background: var(--accent);
      border-radius: 50%;
      animation: dotBounce 1.2s ease infinite;
    }
    .splash-dot:nth-child(2) { animation-delay: 0.2s; background: var(--accent-light); }
    .splash-dot:nth-child(3) { animation-delay: 0.4s; background: var(--cream-dark); }
    @keyframes dotBounce {
      0%, 80%, 100% { transform: scale(0.7); opacity: 0.5; }
      40%            { transform: scale(1.2); opacity: 1; }
    }
  </style>
</head>
<body>

<!-- ══════════════════════════════════
     SPLASH / LOADING SCREEN
═══════════════════════════════════════ -->
<div id="splash-screen">
  <div class="splash-logo-ring">
    <div class="splash-logo-inner">☕</div>
  </div>
  <div class="splash-cafe-name">Brew &amp; Bites</div>
  <div class="splash-tagline">Fresh brews, happy vibes</div>
  <div class="splash-dots">
    <div class="splash-dot"></div>
    <div class="splash-dot"></div>
    <div class="splash-dot"></div>
  </div>
</div>

<div id="app">

  <!-- ──────────────────────────────
       SCREEN 1: MENU
  ────────────────────────────────── -->
  <section id="screen-menu" class="screen active">

    <!-- Header -->
    <header class="menu-header">
      <div class="menu-header-top">
        <div class="cafe-logo-wrap">
          <div class="cafe-logo-icon">☕</div>
          <span class="cafe-name">Brew &amp; Bites</span>
        </div>
        <button class="cart-icon-btn" id="header-cart-btn" onclick="goToCheckout()" aria-label="View cart">
          🛒
          <span class="cart-badge hidden" id="header-cart-count">0</span>
        </button>
      </div>
      <div class="table-pill" id="table-label">
        🪑 Table —
      </div>
    </header>

    <!-- Banner Carousel (5 slides, auto-scroll) -->
    <div class="banner-carousel" id="banner-carousel">
      <div class="banner-track" id="banner-track"></div>
      <div class="banner-dots" id="banner-dots"></div>
    </div>

    <!-- Offer Banner -->
    <div class="offer-banner">
      <span class="offer-tag">Offer</span>
      <span class="offer-text">20% off all Cold Coffee today</span>
    </div>

    <!-- Most Popular (horizontal) -->
    <div class="section-title">Most Popular</div>
    <div class="featured-scroll" id="featured-row"></div>

    <!-- Category Tabs -->
    <div class="categories-scroll" id="category-tabs"></div>

    <!-- Menu Items -->
    <div class="menu-list" id="menu-list"></div>

  </section>

  <!-- ──────────────────────────────
       SCREEN 2: CHECKOUT
  ────────────────────────────────── -->
  <section id="screen-checkout" class="screen">

    <div class="checkout-header">
      <button class="back-btn" onclick="goBack()" aria-label="Go back">←</button>
      <span class="checkout-title">Almost There!</span>
    </div>

    <div class="checkout-body">

      <!-- Name -->
      <div class="checkout-form-group">
        <div class="form-icon-wrap">
          <span class="form-icon">👤</span>
          <input type="text" id="customer-name" class="input-field"
                 placeholder="Your Name" autocomplete="name" />
        </div>
      </div>

      <!-- Table No -->
      <div class="checkout-form-group">
        <div class="form-icon-wrap">
          <span class="form-icon">🪑</span>
          <input type="text" id="table-no-input" class="input-field"
                 placeholder="Table Number" />
        </div>
      </div>

      <!-- Special Instructions -->
      <div class="checkout-form-group">
        <div class="form-icon-wrap textarea-wrap">
          <span class="form-icon">📋</span>
          <textarea id="chef-note" class="textarea-field"
                    placeholder="Special Instructions for Chef (optional)"></textarea>
        </div>
      </div>

      <!-- Order Summary -->
      <div class="order-summary-box">
        <div class="order-summary-title">Order Summary</div>
        <div id="checkout-items-list"></div>
        <hr class="summary-divider" />
        <div class="summary-row">
          <span class="summary-total-label">Total</span>
          <span class="summary-total-price" id="checkout-total">₹0</span>
        </div>
      </div>

    </div>

    <!-- Place Order — sticky footer, always visible -->
    <button class="place-order-btn" id="place-order-btn" onclick="placeOrder()">
      <span>Place Order</span>
    </button>

  </section>

  <!-- ──────────────────────────────
       SCREEN 3: ORDER CONFIRMED
  ────────────────────────────────── -->
  <section id="screen-confirmed" class="screen">
    <div class="confirmed-icon-wrap">✓</div>
    <div class="confirmed-title">Order Placed!</div>
    <div class="confirmed-sub">Kitchen is preparing your order</div>

    <div class="confirmed-card" id="confirmed-summary"></div>

    <button class="order-more-btn" onclick="orderMore()">Order More</button>
  </section>

</div>

<!-- Cart Bar -->
<div class="cart-bar hide" id="cart-bar">
  <div class="cart-bar-left">
    <span class="cart-bar-icon">🛒</span>
    <span class="cart-bar-count" id="cart-bar-text">0 items</span>
  </div>
  <button class="view-order-btn" onclick="goToCheckout()">
    View Order →
  </button>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script type="module" src="app.js"></script>
</body>
</html>
